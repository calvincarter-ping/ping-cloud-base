# Removes old unencrypted StorageClass and updates Logstash , opensearch and S3 Logstash StatefulSets to use KMS-encrypted gp3 storage
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: opensearch-gp3
$patch: delete
---
apiVersion: opensearch.opster.io/v1
kind: OpenSearchCluster
metadata:
  name: opensearch-cluster
spec:
  nodePools:
    - component: hot
      persistence:
        pvc:
          storageClass: opensearch-gp3-kms


