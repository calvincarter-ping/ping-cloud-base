apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: logstash-gp3
$patch: delete
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: opensearch-gp3
$patch: delete
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic
spec:
  volumeClaimTemplates:
  - metadata:
      name: logstash-kms-gp3
    spec:
      storageClassName: logstash-kms-gp3

  template:
    spec:
      containers:
      - name: logstash
        volumeMounts:
        - name: logstash-kms-gp3
          mountPath: /usr/share/logstash/data/queue
---
apiVersion: opensearch.opster.io/v1
kind: OpenSearchCluster
metadata:
  name: opensearch-cluster
spec:
  nodePools:
    - component: hot
      persistence:
        pvc:
          storageClass: opensearch-kms-gp3

