# Delete old StorageClass (non-KMS)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: pingaccess-was-gp3
$patch: delete

---
# Update StatefulSet to use KMS-enabled StorageClass
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pingaccess-was-admin
spec:
  volumeClaimTemplates:
  - metadata:
      name: out-dir
    spec:
      storageClassName: pingaccess-was-gp3-kms