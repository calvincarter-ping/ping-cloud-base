## Chaos testing stage ##
chaos-tests:
  stage: chaos
  retry: 1
  tags:
    - default-gitlab-runner-ping-cloud
  image: ${K8S_DEPLOY_TOOLS}
  script:
    - ${SHARED_CI_SCRIPTS_DIR}/test/run-tests.sh chaos
  dependencies:
    - find-cluster
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always

.cleanup-base:
  stage: cleanup
  tags:
    - default-gitlab-runner-ping-cloud
  image: ${K8S_DEPLOY_TOOLS}
  script:
    - ${SHARED_CI_SCRIPTS_DIR}/k8s/cleanup/teardown.sh

## Cleanup stage that runs when everything has succeeded ##
cleanup-on-success:
  extends: .cleanup-base
  dependencies:
    - find-cluster

## Cleanup stage for failed compile stage ##
cleanup-on-compile-failure:
  extends: .cleanup-base
  needs:
    - compile
    - find-cluster
    - deploy
  when: on_failure
  script:
    # Only cleanup when compile fails.
    # If compile passes, deployment remains for troubleshooting
    - |
      if [ "$COMPILE_RESULT" != 0 ]; then
        ${SHARED_CI_SCRIPTS_DIR}/k8s/cleanup/teardown.sh;
      else
        echo "Compile passed, deployment not torn down to allow for troubleshooting";
      fi

merge-branch:   # Merge current release branch to next upstream release branch
  stage: merge-branch
  tags:
    - default-gitlab-runner-ping-cloud
  image: ${K8S_DEPLOY_TOOLS}
  needs:
    - cleanup-on-success
  script:
    - source ${SHARED_CI_SCRIPTS_DIR}/release/merge-branch.sh
    - merge_release_branch
  variables:
    CREATE_MR: "yes"
  rules:
    - if: '$AUTO_MERGE == "true" && $CI_COMMIT_BRANCH =~ /^v*.*-release-branch$/'
